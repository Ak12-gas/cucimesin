name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: git ls-files -z '*.js' ':!:api-backup/*' | xargs -0 -r -n 1 node --check

      - name: Unit and flow tests
        run: npm test
